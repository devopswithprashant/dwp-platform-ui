# Requires Prometheus Operator (monitoring.coreos.com/v1).
# If you use plain Prometheus from k8s/monitoring/, scrape targets are defined in prometheus-configmap.yaml instead.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dwp-platform-ui
  namespace: dwp-platform
  labels:
    app: dwp-platform-ui
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dwp-platform-ui
  namespaceSelector:
    matchNames:
      - dwp-platform
  endpoints:
    - port: nextjs-metrics
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: nginx-metrics
      interval: 30s
      scrapeTimeout: 10s
