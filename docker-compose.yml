version: '3.8'

services:
  frontend-app:
    image: dwp-ui:latest
    ports:
      - 4200:80
    environment:
      # Backend service configuration
      BACKEND_SERVICE_HOST: backendapi
      BACKEND_SERVICE_PORT: 8080
    depends_on:
      backendapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-app-network
  
  backendapi:
    image: spring-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devblogdb?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devuser
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: devblogdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devuser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devblogdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog-app-network
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  blog-app-network:

volumes:
  pgdata: